[package]
name = "hoard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A self-hosted media library for videos and clips, backed by plain folders"


[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
filetime = "0.2.29"
futures-util = "0.3.34"
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["webp", "jpeg"] }
mime_guess = "2.0.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
shlex = "2.0.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart"] }
